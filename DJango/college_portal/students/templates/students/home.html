<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow p-4 text-center mx-auto" style="max-width: 500px;">
            <h1 class="text-primary mb-3">College Student Portal</h1>
            <p class="text-muted">Welcome to the Student Management System.</p>
            <hr>
            <div class="d-grid gap-2">
                <a href="{% url 'student_list' %}" class="btn btn-outline-primary">View Students</a>
                <a href="{% url 'add_student' %}" class="btn btn-success">Add Student</a>
                <a href="{% url 'search_student' %}" class="btn btn-outline-secondary">Search Student</a>
                <a href="{% url 'high_scorers' %}" class="btn btn-warning">High Scorers (80+)</a>
            </div>
        </div>
    </div>
</body>
</html>
