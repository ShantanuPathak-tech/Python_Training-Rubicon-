<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="text-primary">All Students</h1>
            <div>
                <a href="{% url 'home' %}" class="btn btn-outline-secondary me-2">Home</a>
                <a href="{% url 'add_student' %}" class="btn btn-success me-2">Add Student</a>
                <a href="{% url 'search_student' %}" class="btn btn-info text-white">Search</a>
                <a href="{% url 'export_csv' %}" class="btn btn-outline-dark me-2">Download CSV</a>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-body p-0">
                <table class="table table-hover table-striped mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Name</th>
                            <th>Marks</th>
                            <th>Department</th>
                            <th class="text-end pe-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for student in students %}
                        <tr>
                            <td class="fw-bold">{{ student.name }}</td>
                            <td><span class="badge bg-primary fs-6">{{ student.marks }}</span></td>
                            <td>{{ student.department }}</td>
                            <td><span class="badge bg-secondary">{{ student.get_grade }}</span></td>
                            <td class="text-end me-2">
                                <a href="{% url 'edit_student' student.id %}" class="btn btn-sm btn-warning me-1">Edit</a>
                                <form method="POST" action="{% url 'delete_student' student.id %}" style="display:inline;">
                                    {% csrf_token %}
                                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Delete this student?')">Delete</button>
                                </form>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="4" class="text-center py-4 text-muted">No students found.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
